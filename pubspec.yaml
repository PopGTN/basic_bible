name: basic_bible
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  english_words: ^4.0.0 #old
  provider: ^6.1.5 # old
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  go_router: ^16.2.1
  url_launcher: ^6.3.2
  window_manager: ^0.5.1 
  shared_preferences: ^2.5.3
  flutter_launcher_icons: ^0.14.4
  window_size:
    git:
      url: https://github.com/google/flutter-desktop-embedding.git
      path: plugins/window_size

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png" 